name: 'toll_dbt_project'
version: '1.0.0'
config-version: 2

profile: 'toll_dbt_project'  # Harus sama persis dengan nama di profiles.yml

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  toll_dbt_project:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
