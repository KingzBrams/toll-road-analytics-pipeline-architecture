version: '3.8'

# ===================================================================================
# Custom Network Configuration (Enterprise Isolation & Service Discovery)
# ===================================================================================
networks:
  toll_dw_network:
    driver: bridge
    name: toll_dw_network

# ===================================================================================
# Common Configuration for Airflow Services 
# ===================================================================================
x-airflow-common: &airflow-common
  image: apache/airflow:2.7.1-python3.10
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres-airflow/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    _PIP_ADD_REQUIREMENTS: "clickhouse-connect apache-airflow-providers-http"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
  user: "${AIRFLOW_UID:-5000}:0"
  networks:
    - toll_dw_network
  depends_on:
    redis:
      condition: service_healthy
    postgres-airflow:
      condition: service_healthy

services:
  # ===================================================================================
  # Airflow Core Infrastructure
  # ===================================================================================
  postgres-airflow:
    image: postgres:15-alpine
    container_name: postgres_airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data
    networks:
      - toll_dw_network
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "airflow" ]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  redis:
    image: redis:7.0-alpine
    container_name: airflow_redis
    ports:
      - "6379:6379"
    networks:
      - toll_dw_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-init:
    <<: *airflow-common
    container_name: airflow_init
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_UPGRADE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD}
    user: "0:0"
    depends_on:
      postgres-airflow:
        condition: service_healthy
      redis:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres-airflow:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres-airflow:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  airflow-worker:
    <<: *airflow-common
    container_name: airflow_worker
    command: celery worker
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres-airflow:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"
    restart: always

  # ===================================================================================
  # ClickHouse Data Warehouse
  # ===================================================================================
  clickhouse:
    image: clickhouse/clickhouse-server:23.8-alpine
    container_name: clickhouse_dw
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DB}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - toll_dw_network
    restart: always

  # ===================================================================================
  # Mock Data API (Sekarang otomatis menyala bersama service lain)
  # ===================================================================================
  data-gen-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: data_gen_api
    ports:
      - "8000:8000"
    networks:
      - toll_dw_network
    environment:
      - PYTHONUNBUFFERED=1
    restart: always

  # ===================================================================================
  # dbt CLI
  # ===================================================================================
  dbt-cli:
    image: ghcr.io/dbt-labs/dbt-clickhouse:latest
    container_name: dbt_cli
    profiles:
      - dbt-run
    volumes:
      - ./dbt:/usr/app
    working_dir: /usr/app
    networks:
      - toll_dw_network
    entrypoint: [ "tail", "-f", "/dev/null" ]

volumes:
  postgres_airflow_data:
  clickhouse_data:
